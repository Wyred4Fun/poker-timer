name: Build Catalpa Club Poker Timer and Digital Billboard (Poker Timer on request)

# Every push builds Catalpa Club Poker Timer (club TV with poker) and Digital Billboard (slides only).
# Poker Timer is finished and parked: it is only built when the commit message contains [poker]
# or when this workflow is run by hand with "poker" ticked.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      poker:
        description: 'Also build Poker Timer'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WITH_POKER: ${{ (github.event_name == 'workflow_dispatch' && inputs.poker) || contains(github.event.head_commit.message, '[poker]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Run gradle assembleRelease
        run: |
          TASKS="testClubReleaseUnitTest assembleClubRelease assembleSignageRelease"
          if [ "$WITH_POKER" = "true" ]; then TASKS="$TASKS assemblePokerRelease"; fi
          gradle --no-daemon $TASKS

      - name: Publish the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          # Catalpa Club Poker Timer: build-N (the release the club TV's Update button looks for)
          CLUB="CatalpaClubPokerTimer-1.0.$N.apk"
          cp app/build/outputs/apk/club/release/app-club-release.apk "$CLUB"
          gh release create "build-$N" "$CLUB" \
            --prerelease \
            --title "Catalpa Club Poker Timer 1.0.$N" \
            --notes "Built from commit ${{ github.sha }}" \
          || gh release upload "build-$N" "$CLUB" --clobber
          # Digital Billboard (slides only, for the other screens): signage-N
          SIGN="DigitalBillboard-1.0.$N.apk"
          cp app/build/outputs/apk/signage/release/app-signage-release.apk "$SIGN"
          gh release create "signage-$N" "$SIGN" \
            --prerelease \
            --title "Digital Billboard 1.0.$N" \
            --notes "Built from commit ${{ github.sha }}" \
          || gh release upload "signage-$N" "$SIGN" --clobber
          # Poker Timer on its own: poker-N (only when asked for)
          if [ "$WITH_POKER" = "true" ]; then
            POKER="PokerTimer-1.0.$N.apk"
            cp app/build/outputs/apk/poker/release/app-poker-release.apk "$POKER"
            gh release create "poker-$N" "$POKER" \
              --prerelease \
              --title "Poker Timer 1.0.$N" \
              --notes "Built from commit ${{ github.sha }}" \
            || gh release upload "poker-$N" "$POKER" --clobber
          fi
